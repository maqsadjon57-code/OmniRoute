<div class="modal" data-component="PermissionDialog" role="dialog">
  <div class="modal-head warn">🔐 Permission required</div>
  <div class="modal-body">
    <p>Claude wants to run a tool.</p>
    <div class="perm-cmd"><span class="dollar">$</span> command</div>
  </div>
  <div class="modal-actions">
    <button class="btn btn-ghost">⛔ Never</button>
    <button class="btn">⏭ Always</button>
    <button class="btn btn-danger">❌ Deny</button>
    <button class="btn btn-primary">✅ Allow</button>
  </div>
</div>
