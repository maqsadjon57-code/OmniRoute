version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aifitness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aifitness
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret
      HMAC_SECRET: dev-hmac
    depends_on:
      - postgres
      - redis

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"

volumes:
  pgdata:
