[versions]
agp = "8.2.2"
kotlin = "1.9.22"
coreKtx = "1.12.0"
composeBom = "2024.02.00"
lifecycle = "2.7.0"
navigation = "2.7.6"
hilt = "2.50"
hiltNavigation = "1.1.0"
room = "2.6.1"
datastore = "1.0.0"
retrofit = "2.9.0"
okhttp = "4.12.0"
coroutines = "1.7.3"
camerax = "1.3.1"
mediapipe = "0.10.8"
firebaseBom = "32.7.0"
playBilling = "6.1.0"
ads = "22.5.0"
healthConnect = "1.1.0-alpha06"
serialization = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
